# =============================================================================
#  Starling 2 Max -- unified vehicle parameter file
# =============================================================================
#  EVERY number below is one of three kinds, declared in the `provenance:`
#  block at the bottom of this file:
#
#    EXTRACTED    read verbatim from assets/robot/starling2max.usd
#    DERIVED      computed from that USD's geometry, assumption stated
#    ASSUMED      NOT in the asset and NOT measured -- a declared design
#                 assumption, carrying an UNIDENTIFIED_* tag
#
#  `tests/test_config_matches_asset.py` mechanically re-checks every EXTRACTED
#  and DERIVED value against reports/asset_audit.json, so this file cannot
#  silently drift away from the asset.
#
#  >>> THIS VEHICLE MODEL IS NOT AERODYNAMICALLY CALIBRATED. <<<
#  See `aero:` and the UNIDENTIFIED_AERODYNAMICS tag.
# =============================================================================

name: starling_2_max
usd_path: assets/robot/starling2max.usd
prim_path: /World/Drone

# --- frame conventions -------------------------------------------------------
# The CAD body frame is NOT the usual x-forward convention: the front sensor
# module sits at body -Y and its cameras look along -Y.  Nothing is rotated to
# hide this; the mixer works directly in the CAD body frame (it uses the real
# rotor positions, so it is correct regardless of where the nose points), and
# `nose_axis_body` is the single place that tells the heading logic which way
# is forward.
frames:
  up_axis: Z
  meters_per_unit: 1.0
  nose_axis_body: [0.0, -1.0, 0.0]   # EXTRACTED (front camera optical axis)
  thrust_axis_body: [0.0, 0.0, 1.0]

# --- rigid body --------------------------------------------------------------
rigid_body:
  mass: 0.5                          # kg   EXTRACTED (physics:mass)
  center_of_mass: [0.0, 0.0, 0.0]    # m    EXTRACTED (physics:centerOfMass)

  # The USD authors diagonalInertia = (0,0,0), i.e. it does NOT specify the
  # inertia tensor and PhysX would fall back to the collider box.  The three
  # candidates below differ by ~2.5x, so the choice is made explicit here
  # rather than left to a silent default.
  inertia:
    source: mesh_uniform_density     # mesh_uniform_density | collider_box | visual_bbox_box
    mesh_uniform_density: [0.00188134, 0.00296891, 0.00460951]  # DERIVED
    collider_box:         [0.00565343, 0.00589678, 0.01036850]  # DERIVED
    visual_bbox_box:      [0.00565343, 0.00589678, 0.01036850]  # DERIVED
    off_diagonal_ratio: 0.00313      # DERIVED: products of inertia are <0.4% of
                                     # the diagonal, so a diagonal tensor is a
                                     # good approximation for this asset.

  collision:
    type: box
    full_extents: [0.35685030, 0.34857082, 0.11908252]   # m  EXTRACTED
    center: [0.0, 0.0, -0.00804126]                      # m  EXTRACTED

  # Physics-solver hygiene (simulator settings, not vehicle properties).
  solver:
    linear_damping: 0.0              # aero handled by our own model, not PhysX
    angular_damping: 0.0
    max_linear_velocity: 100.0
    max_angular_velocity: 100.0
    enable_gyroscopic_forces: true

# --- rotors ------------------------------------------------------------------
rotors:
  # Positions and spin directions are EXTRACTED from the drone:spinDir frames,
  # which sit at the centres of the four motor meshes.  Quad-X layout verified:
  # diagonally opposite rotors share a spin direction.
  positions:                                   # m, body frame
    - [ 0.12999008,  0.09499349, 0.01775000]   # rotor_0  (Body1_4)
    - [ 0.13000994, -0.09500652, 0.01775000]   # rotor_1  (Body1_2)
    - [-0.13000651,  0.09499007, 0.01775000]   # rotor_2  (Body1_6)
    - [-0.13000994, -0.09500652, 0.01775000]   # rotor_3  (Body1_8)
  spin_dirs: [1, -1, -1, 1]                    # EXTRACTED; +1 = CCW about +Z
  arm_length: 0.161015                         # m  DERIVED (mean sqrt(x^2+y^2))

  # ---------------------------------------------------------------------------
  # UNIDENTIFIED_PROPULSION
  # ---------------------------------------------------------------------------
  # The asset contains no motor, ESC or propeller data.  Rather than invent
  # datasheet numbers, the thrust constant is *defined* by a declared operating
  # point: at `max_speed` a rotor produces `max_thrust_to_weight/4` of the
  # vehicle weight.  Changing either number rescales k_f consistently.
  #
  #     f_i   = k_f * w_i^2
  #     tau_i = k_m * w_i^2 * (-spin_dir_i)      (reaction torque)
  #     k_f   = (max_thrust_to_weight * m * g / n_rotors) / max_speed^2
  #     k_m   = k_f * torque_to_thrust_ratio
  #
  propulsion:
    max_thrust_to_weight: 2.5        # ASSUMED
    max_speed: 2500.0                # rad/s   ASSUMED
    min_speed: 0.0                   # rad/s
    torque_to_thrust_ratio: 0.016    # m       ASSUMED
    time_constant: 0.0333            # s       ASSUMED (1st-order motor lag)
    rotor_polar_inertia: 0.0         # kg m^2  ASSUMED-ZERO: prop gyroscopic
                                     # coupling is DISABLED because no prop
                                     # inertia is known. Set >0 to enable.

# --- aerodynamics ------------------------------------------------------------
# =============================================================================
#  UNIDENTIFIED_AERODYNAMICS
# =============================================================================
#  NOTHING in this block has been measured on a real Starling 2 Max, in a wind
#  tunnel, or against flight logs.  It is a deliberately LOW-ORDER model whose
#  purpose is to make wind *matter* in a physically-plausible, well-conditioned
#  way so that the world model has something to learn -- NOT to reproduce the
#  true aerodynamics of the vehicle.
#
#  Do not present results from this model as aerodynamically validated.
#  Every coefficient is domain-randomised (see `domain_randomization`) so that
#  downstream policies/world models are trained across the uncertainty rather
#  than overfitted to one wrong number.
# =============================================================================
aero:
  status: UNIDENTIFIED_AERODYNAMICS
  air_density: 1.225                 # kg/m^3  standard sea level, 15 C

  # Quadratic body drag on the wind-relative velocity, per body axis:
  #     F_drag = -0.5 * rho * CdA * |v_rel| * v_rel        (component-wise CdA)
  # CdA is sized from the bbox face areas with an open-frame solidity factor:
  #     face areas (m^2): x 0.041513, y 0.042500, z 0.124382
  #     CdA = area * Cd * solidity,  Cd = [1.0, 1.0, 1.2], solidity = 0.35
  body_drag:
    model: quadratic
    cda: [0.014530, 0.014875, 0.052240]      # m^2  ASSUMED
    solidity: 0.35                           # ASSUMED (open-frame porosity)

  # Linear "rotor drag" / blade-flapping term.  A translating rotor disc tilts
  # its thrust vector backwards, producing a force roughly linear in the
  # in-plane wind-relative velocity.  First-order, coefficient not identified.
  rotor_drag:
    model: linear
    coeff: [0.010, 0.010, 0.0]               # N/(m/s)  ASSUMED
    scale_with_thrust: true                  # multiply by (total_thrust / mg)

  # Angular damping about each body axis, quadratic in body rates.
  angular_drag:
    model: quadratic
    coeff: [0.0008, 0.0008, 0.0012]          # N m/(rad/s)^2  ASSUMED

  # Ground effect: thrust augmentation when a rotor is within a few radii of
  # the ground.  Cheeseman-Bennett form, prop radius itself is not in the asset.
  ground_effect:
    enabled: false                           # off by default: R is unknown
    rotor_radius: 0.0635                     # m  ASSUMED (~5 in prop)
    max_gain: 1.25                           # ASSUMED

# --- sensors -----------------------------------------------------------------
# Poses are EXTRACTED (real, from the CAD).  Everything optical is ASSUMED:
# UNIDENTIFIED_SENSOR_INTRINSICS.  The optical axis of each frame is the frame's
# local +X, which is the convention baked into the asset by add_drone_frames.py.
sensors:
  intrinsics_status: UNIDENTIFIED_SENSOR_INTRINSICS
  cameras:
    - name: cam_tracking_front
      type: tracking
      position: [0.0, -0.07608757, 0.02100000]      # m  EXTRACTED
      optical_axis_body: [0.0, -1.0, 0.0]           #    EXTRACTED
      width: 160                                    # ASSUMED
      height: 120                                   # ASSUMED
      horizontal_fov_deg: 120.0                     # ASSUMED
    - name: cam_hires_front
      type: hires
      position: [0.0, -0.07799996, 0.00298424]      # m  EXTRACTED
      optical_axis_body: [0.0, -1.0, 0.0]           #    EXTRACTED
      width: 160                                    # ASSUMED
      height: 120                                   # ASSUMED
      horizontal_fov_deg: 80.0                      # ASSUMED
    - name: cam_tracking_down
      type: tracking
      position: [0.013, 0.05700000, -0.01678756]    # m  EXTRACTED
      optical_axis_body: [0.0, 0.0, -1.0]           #    EXTRACTED
      width: 160                                    # ASSUMED
      height: 120                                   # ASSUMED
      horizontal_fov_deg: 120.0                     # ASSUMED
    - name: cam_hires_down
      type: hires
      position: [-0.005, 0.05701576, -0.01869999]   # m  EXTRACTED
      optical_axis_body: [0.0, 0.0, -1.0]           #    EXTRACTED
      width: 160                                    # ASSUMED
      height: 120                                   # ASSUMED
      horizontal_fov_deg: 80.0                      # ASSUMED
  depth:
    - name: tof_link
      type: tof_depth
      position: [-0.018, -0.07799996, 0.00298424]   # m  EXTRACTED
      optical_axis_body: [0.0, -1.0, 0.0]           #    EXTRACTED
      width: 64                                     # ASSUMED
      height: 64                                    # ASSUMED
      horizontal_fov_deg: 106.0                     # ASSUMED
      min_range: 0.2                                # m  ASSUMED
      max_range: 6.0                                # m  ASSUMED

  # Which camera the visual world model consumes by default.  Only ONE camera
  # per env is rendered in parallel runs -- see the VRAM budget in the README.
  world_model_camera: cam_tracking_front

  # IMU noise applied to the RECORDED imu_accel / imu_gyro channels only.
  # The controller still sees clean state (a real vehicle would use an
  # estimator); this makes the dataset's IMU channels realistic inputs for the
  # world model. Not measured for this vehicle -- generic MEMS figures.
  imu:
    status: UNIDENTIFIED_SENSOR_INTRINSICS
    rate_hz: 100.0                  # plan §2; recorded at the 10 Hz data rate
    accel_noise_std: 0.08           # m/s^2   ASSUMED
    gyro_noise_std: 0.008           # rad/s   ASSUMED
    accel_bias_std: 0.05            # m/s^2   ASSUMED, per episode
    gyro_bias_std: 0.004            # rad/s   ASSUMED, per episode

# --- domain randomisation ----------------------------------------------------
# Applied per-environment at reset.  Ranges are multiplicative unless noted.
# The unidentified quantities get the widest ranges, on purpose.
domain_randomization:
  enabled: true
  mass:                  [0.85, 1.15]
  inertia:               [0.75, 1.30]
  center_of_mass_offset: [-0.010, 0.010]    # m, additive, per axis
  thrust_constant:       [0.90, 1.10]
  torque_constant:       [0.85, 1.15]
  motor_time_constant:   [0.70, 1.40]
  # UNIDENTIFIED_AERODYNAMICS -> wide, because the nominal value is a guess.
  body_drag_cda:         [0.50, 2.00]
  rotor_drag_coeff:      [0.30, 2.50]
  angular_drag_coeff:    [0.50, 2.00]

# --- provenance --------------------------------------------------------------
# dotted path -> {status, note}.  Checked by tests/test_config_matches_asset.py:
#   * every path must resolve
#   * every EXTRACTED / DERIVED path must equal the audit JSON
provenance:
  frames.nose_axis_body:
    status: EXTRACTED
    audit_key: sensors.optical_axis.forward
    note: Optical axis of cam_tracking_front / cam_hires_front / tof_link.
  rigid_body.mass:
    status: EXTRACTED
    audit_key: body.mass
    note: >
      physics:mass in the USD. The generator script add_drone_physics.py has
      --mass default 0.5, so this is almost certainly the script default and
      not a weighed vehicle. Treat the absolute scale as uncertain; the
      controller is normalised by mg so it is insensitive to this.
  rigid_body.center_of_mass:
    status: EXTRACTED
    audit_key: body.com
    note: Authored as the body origin, not a measured CG.
  rigid_body.inertia.mesh_uniform_density:
    status: DERIVED
    audit_key: inertia.mesh_uniform_density
    note: >
      Tetrahedron integration over all 1.75 M CAD triangles, assuming a
      watertight uniform-density solid. The real vehicle is neither (battery
      and motors dominate). Chosen as the default because it is the only
      candidate that reflects the actual mass distribution of the airframe;
      the collider box overestimates it by ~2.3-3x.
  rigid_body.inertia.collider_box:
    status: DERIVED
    audit_key: inertia.collider_box
    note: What PhysX would use by default, since diagonalInertia is (0,0,0).
  rigid_body.collision.full_extents:
    status: EXTRACTED
    audit_key: collision.full_extents
  rotors.positions:
    status: EXTRACTED
    audit_key: rotors.positions
  rotors.spin_dirs:
    status: EXTRACTED
    audit_key: rotors.spin_dirs
  rotors.arm_length:
    status: DERIVED
    audit_key: rotors.arm_length_m
  rotors.propulsion.max_thrust_to_weight:
    status: ASSUMED
    tag: UNIDENTIFIED_PROPULSION
    note: >
      No thrust-stand data exists for this asset. 2.5:1 is a conservative
      figure for a sub-kilogram quad; it defines k_f together with max_speed.
  rotors.propulsion.max_speed:
    status: ASSUMED
    tag: UNIDENTIFIED_PROPULSION
    note: No motor KV / ESC data in the asset.
  rotors.propulsion.torque_to_thrust_ratio:
    status: ASSUMED
    tag: UNIDENTIFIED_PROPULSION
    note: Sets yaw authority. Not measured.
  rotors.propulsion.time_constant:
    status: ASSUMED
    tag: UNIDENTIFIED_PROPULSION
    note: First-order motor/ESC lag. Not measured.
  rotors.propulsion.rotor_polar_inertia:
    status: ASSUMED
    tag: UNIDENTIFIED_PROPULSION
    note: >
      Set to 0, which DISABLES propeller gyroscopic coupling. Not a claim that
      it is zero -- a claim that it is unknown and therefore not modelled.
  aero.body_drag.cda:
    status: ASSUMED
    tag: UNIDENTIFIED_AERODYNAMICS
    note: >
      bbox face area x Cd x solidity. Never measured. Domain-randomised 0.5-2x.
  aero.rotor_drag.coeff:
    status: ASSUMED
    tag: UNIDENTIFIED_AERODYNAMICS
    note: Blade-flapping / rotor-drag placeholder. Never measured.
  aero.angular_drag.coeff:
    status: ASSUMED
    tag: UNIDENTIFIED_AERODYNAMICS
    note: Rotational damping placeholder. Never measured.
  aero.ground_effect.rotor_radius:
    status: ASSUMED
    tag: UNIDENTIFIED_AERODYNAMICS
    note: Prop radius is not in the asset; ground effect is disabled by default.
  sensors.imu.accel_noise_std:
    status: ASSUMED
    tag: UNIDENTIFIED_SENSOR_INTRINSICS
    note: >
      Generic consumer-MEMS figure. The asset carries no IMU frame or datasheet
      at all. Applied only to the recorded IMU channels, never to the state the
      controller uses.
  sensors.imu.gyro_noise_std:
    status: ASSUMED
    tag: UNIDENTIFIED_SENSOR_INTRINSICS
    note: Generic consumer-MEMS figure; not measured.
  sensors.cameras:
    status: MIXED
    tag: UNIDENTIFIED_SENSOR_INTRINSICS
    note: >
      Positions and optical axes are EXTRACTED. Resolution and FOV are ASSUMED
      -- the USD carries poses only. Resolutions are deliberately small
      (160x120) to fit many camera-enabled environments in 8 GiB of VRAM.
