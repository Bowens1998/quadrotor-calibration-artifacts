# Dataset collection over scenes x wind conditions (spec §9, §10).
out_dir: data/episodes
manifest: data/manifests/episodes.json
duration_s: 12.0
episodes_per_pair: 2        # per (scene, wind cond): 1 tracking + 1 perturbation
batch_envs: 16
device: cuda
depth_hw: [64, 64]
patch_size: 16
patch_spacing: 0.5
base_seed: 1000
